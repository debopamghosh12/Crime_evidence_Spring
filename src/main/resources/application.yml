# K3: every environment-specific value and every secret comes from an environment variable.
# Nothing secret has a default here (constraint C-07): DB_PASSWORD and BLOCKEVIDENCE_JWT_SECRET are
# required, and the application refuses to start without them.
spring:
  application:
    name: blockevidence-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/blockevidence}
    username: ${DB_USER:blockevidence}
    password: ${DB_PASSWORD}
  servlet:
    multipart:
      # B2: hard size limit, enforced by the servlet container before any controller code runs.
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:50MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:52MB}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema (V*.sql). Hibernate only checks that the entities match it.
      ddl-auto: validate

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      # Anonymous callers see only the overall status. Per-component detail (db / ipfs / ledger)
      # is shown to authenticated users holding the ADMIN role.
      show-details: when-authorized
      roles: ADMIN

blockevidence:
  jwt:
    # No default: empty binds to "" and fails @NotBlank in JwtProperties, so startup aborts.
    secret: ${BLOCKEVIDENCE_JWT_SECRET:}
    access-ttl: ${JWT_ACCESS_TTL:15m}
    refresh-ttl: ${JWT_REFRESH_TTL:7d}
  ipfs:
    api-url: ${IPFS_API_URL:http://localhost:5001}
    transfer-timeout: ${IPFS_TRANSFER_TIMEOUT:60s}
    lookup-timeout: ${IPFS_LOOKUP_TIMEOUT:10s}
  fabric:
    channel: ${FABRIC_CHANNEL:crimechannel}
    chaincode: ${FABRIC_CHAINCODE:evidence}
    peer-endpoint: ${FABRIC_PEER_ENDPOINT:localhost:7051}
    peer-host-alias: ${FABRIC_PEER_HOST_ALIAS:peer0.org1.example.com}
    msp-id: ${FABRIC_MSP_ID:Org1MSP}
    # Identity material is referenced by PATH and never stored in the repo (C-07). All three are needed for the
    # ledger to be "configured"; without them the app starts and ledger calls answer 503. Each cert/key path may
    # be a file or a directory holding exactly one file (Fabric MSP: signcerts/, keystore/).
    tls-cert-path: ${FABRIC_TLS_CERT_PATH:}
    cert-path: ${FABRIC_CERT_PATH:}
    key-path: ${FABRIC_KEY_PATH:}
    # A2: per-user identities for writes (docs/A2_IDENTITY_DESIGN.md). Maintained by scripts/fabric/enroll_users.sh,
    # never by the running app. wallet-passphrase is needed only if the wallet's keys are PKCS#8-encrypted.
    wallet-dir: ${FABRIC_WALLET_DIR:}
    wallet-passphrase: ${FABRIC_WALLET_PASSPHRASE:}
  encryption:
    # F2/F3, CONSTRAINTS.md C-10: no default (C-07's "refuse to start" rule) - base64 AES-256, e.g.
    # `openssl rand -base64 32`. Protects every user's stored private key at rest; MasterKey validates the
    # decoded length at startup.
    master-key: ${BLOCKEVIDENCE_ENCRYPTION_MASTER_KEY:}

# K2: springdoc-openapi generates the spec from the controller/DTO annotations at runtime - nothing here is
# hand-maintained content, just where it renders. Swagger UI at /swagger-ui.html (redirects to
# /swagger-ui/index.html); raw spec at /v3/api-docs. Both are permitted without a token (SecurityConfig) so the
# documentation itself is browsable without logging in - trying an operation from the UI still needs a real one.
springdoc:
  swagger-ui:
    operationsSorter: method
    tagsSorter: alpha
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
